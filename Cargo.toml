[package]
name = "agent-gate"
version = "0.1.0"
edition = "2024"
build = "build.rs"
description = "Local SSH isolation relay workbench for AI Agents built with Rust and GPUI"
license = "MIT"

[dependencies]
anyhow = "1.0"
bytes = "1.7"
chrono = { version = "0.4", features = ["serde"] }
data-encoding = "2.6"
dirs = "6.0"
futures = "0.3"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
rand = "0.10"
ring = "0.17.14"
russh = { version = "0.65.1", default-features = false, features = ["flate2", "ring", "rsa"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
unicode-segmentation = "1.12"
uuid = { version = "1.11", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ksni = "0.3"

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
tempfile = "3.14"

[patch.crates-io]
xattr = { path = "vendor/xattr" }
